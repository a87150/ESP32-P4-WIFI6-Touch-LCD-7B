## IDF Component Manager Manifest File
dependencies:
  espressif/brookesia_system_core:
    version: "0.8.*"
    override_path: ../../../../system/brookesia_system_core
    require: public

  espressif/brookesia_service_helper:
    version: "0.8.*"
    override_path: ../../../../service/framework/brookesia_service_helper
    require: public

  espressif/brookesia_hal_interface:
    version: "0.8.*"
    override_path: ../../../../hal/brookesia_hal_interface
    require: public

  # Software H.264 decoder (tinyH264) for MP4 files. The ESP32-P4 only has a
  # hardware H.264 *encoder*, so decoding runs on the CPU (720p ~10 fps).
  espressif/esp_h264:
    version: "^1.5.0"
    require: public
